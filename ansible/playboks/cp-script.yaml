---
- name: Prepare Kubernetes nodes and join workers
  hosts: kubernetes
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    lb_endpoint: "192.168.56.31:6443"

  tasks:
    - name: Check if kubeadm is installed
      ansible.builtin.command:
        cmd: which kubeadm
      register: kubeadm_check_installed
      changed_when: false
      failed_when: false

    - name: Copy kubeadm setup script
      ansible.builtin.copy:
        src: ../../kubeadm.sh
        dest: /tmp/kubeadm.sh
        mode: "0755"
      when: kubeadm_check_installed.rc != 0

    - name: Install and initialize kubeadm
      ansible.builtin.command:
        cmd: /tmp/kubeadm.sh
      when: kubeadm_check_installed.rc != 0

    - name: Check if control-plane is initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: control_plane_initialized
      when: inventory_hostname == "control-plane-1"

    - name: Fetch kubeconfig to local machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: ./.kubeconfig
        flat: true
      when:
        - inventory_hostname == "control-plane-1"
        - control_plane_initialized.stat.exists
    - name: Set Haproxy endpoint in configureation
      ansible.builtin.copy:
        src: ../../kubernetes/haproxy_config.sh
        dest: /tmp/haproxy_config.sh
        mode: "0755"
      when:
        - inventory_hostname == "control-plane-1"
        - control_plane_initialized.stat.exists
    - name: Execute Haproxy configuration script
      ansible.builtin.command:
        cmd: /tmp/haproxy_config.sh
      when:
        - inventory_hostname == "control-plane-1"
        - control_plane_initialized.stat.exists

    - name: Get join command from control-plane
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false
      when:
        - inventory_hostname == "control-plane-1"
        - control_plane_initialized.stat.exists

    - name: Check if worker already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf
      when: inventory_hostname in groups['workers']

    - name: Execute join command on worker nodes
      ansible.builtin.command:
        cmd: >-
          {{
            hostvars['control-plane-1']['kubeadm_join_command']['stdout']
            | regex_replace('([0-9]{1,3}\.){3}[0-9]{1,3}:6443', lb_endpoint)
          }}
      when:
        - inventory_hostname in groups['workers']
        - not kubelet_conf.stat.exists
        - hostvars['control-plane-1']['kubeadm_join_command'] is defined
...
