global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "codelab-monitor"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "etcd"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/secrets/kubernetes/ca.crt
      cert_file: /etc/prometheus/secrets/kubernetes/client.crt
      key_file: /etc/prometheus/secrets/kubernetes/client.key
    static_configs:
      - targets:
          ["192.168.56.11:2381", "192.168.56.12:2381", "192.168.56.13:2381"]

  - job_name: "kubernetes-servers"
    static_configs:
      - targets:
          ["192.168.56.11:9100", "192.168.56.12:9100", "192.168.56.13:9100"]
  - job_name: "haproxy-servers"
    static_configs:
      - targets: ["192.168.56.31:9100", "192.168.56.32:9100"]

  - job_name: "haproxy"
    static_configs:
      - targets: ["192.168.56.31:8405", "192.168.56.32:8405"]
